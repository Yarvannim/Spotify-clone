apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: spotify-clone
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              value: "http://stream-service.spotify-clone.svc.cluster.local:8008"
            - name: REACT_APP_KEYCLOAK_URL
              value: "http://keycloak.spotify-clone.svc.cluster.local:8080"
            - name: REACT_APP_KEYCLOAK_REALM
              value: "spotify-clone"
            - name: REACT_APP_KEYCLOAK_CLIENT_ID
              value: "spotify-frontend"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              port: 80
              path: /
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              port: 80
              path: /
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: spotify-clone
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP