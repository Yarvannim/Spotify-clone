apiVersion: v1
kind: ServiceAccount
metadata:
  name: stream-service-sa
  namespace: spotify-clone
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/spotify-clone-stream-service-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-service
  namespace: spotify-clone
  labels:
    app: stream-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-service
  template:
    metadata:
      labels:
        app: stream-service
    spec:
      serviceAccountName: stream-service-sa
      containers:
        - name: stream-service
          image: nginx:alpine
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "aws"
            - name: SPRING_DATA_CASSANDRA_CONTACT_POINTS
              valueFrom:
                configMapKeyRef:
                  name: aws-config
                  key: keyspaces_contact_points
            - name: SPRING_DATA_CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keyspaces-credentials
                  key: keyspaces_username
            - name: SPRING_DATA_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keyspaces-credentials
                  key: keyspaces_password
            - name: SPRING_ELASTICSEARCH_URIS
              valueFrom:
                configMapKeyRef:
                  name: aws-config
                  key: opensearch_endpoint
            - name: SPRING_ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: opensearch_username
            - name: SPRING_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: opensearch_password
            - name: AWS_REGION
              value: "eu-central-1"
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: aws-config
                  key: s3_bucket_name
            - name: KEYCLOAK_ISSUER_URL
              value: "http://keycloak.spotify-clone.svv.cluster.local:8080/realms/spotify-clone"
          ports:
            - containerPort: 8008
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              port: 8008
              path: /actuator/health
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              port: 8008
              path: /actuator/health
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stream-service
  namespace: spotify-clone
spec:
  selector:
    app: stream-service
  ports:
    - port: 8008
      targetPort: 8008
  type: ClusterIP
